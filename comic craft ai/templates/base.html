<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        ComicCraft
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

<header class="site-header">

    <a
        href="/"
        class="brand"
    >
        🎨 ComicCraft
    </a>

    <span class="tagline">
        Turn ideas into comics
    </span>

</header>


<main class="page-shell">

    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">

    <span>
        ComicCraft • AI Comic Story Creator
    </span>

    <a href="/docs">
        API Docs
    </a>

</footer>


<script
    src="{{ url_for('static', path='css/js/app.js') }}"
></script>

</body>

</html>
