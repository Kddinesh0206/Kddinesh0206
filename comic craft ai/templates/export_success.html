{% extends "base.html" %}

{% block title %}
Export Complete — ComicCraft
{% endblock %}


{% block content %}

<section class="card success-card">

    <div class="success-icon">
        ✓
    </div>

    <p class="eyebrow">
        EXPORT COMPLETE
    </p>

    <h1>
        Your comic is ready!
    </h1>

    <p>
        {{ filename }}
        has been created successfully.
    </p>

    <a
        href="/"
        class="primary-btn"
    >
        Go Create Another Comic
    </a>

</section>

{% endblock %}
